<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skyline Sprint</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <p class="eyebrow">Canvas Platformer Demo</p>
      <h1>Skyline Sprint</h1>
      <p class="summary">
        1ステージだけの横スクロールアクションです。走って、跳んで、見張りをかわし、
        旗のある出口までたどり着いてください。
      </p>
    </section>

    <section class="game-panel" aria-label="ゲーム画面">
      <div class="hud" aria-live="polite">
        <div>
          <span class="hud-label">State</span>
          <strong id="stateLabel">TITLE</strong>
        </div>
        <div>
          <span class="hud-label">Hint</span>
          <strong id="hintLabel">Press Enter or Space</strong>
        </div>
      </div>

      <div class="canvas-frame">
        <canvas
          id="gameCanvas"
          width="960"
          height="540"
          aria-label="Skyline Sprint game canvas"
        ></canvas>

        <div class="overlay" id="overlay">
          <p class="overlay-kicker" id="overlayKicker">ONE STAGE RUN</p>
          <h2 id="overlayTitle">Skyline Sprint</h2>
          <p id="overlayMessage">Enter か Space でスタート</p>
          <p class="controls">Move: ← → or A D / Jump: Space or W</p>
        </div>
      </div>
    </section>
  </main>

  <script src="./game.js"></script>
</body>
</html>
